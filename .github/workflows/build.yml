name: build

on:
  push:
    branches: [main, libslang-vk]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push makes an older build of the same ref pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Builds the game's Glide renderer DLL only  the d2.exe tree is NOT built
# here (the 500-TU clean-clone gate lives in tools/check-build.sh, run by
# hand). glide3x.dll is self-contained and needs no game objects to link.

jobs:
  glide3x:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # P3: the preset chain links the static slangvk target from the
      # libslang-vk checkout. Pinned for reproducible builds — bump with care
      # (BUILD-32BIT.md holds the i686 recipe + verification checklist).
      - name: Check out libslang-vk (pinned)
        uses: actions/checkout@v4
        with:
          repository: VTSTech/libslang-vk
          ref: d208ac5
          path: libslang-vk

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-i686 binutils-mingw-w64-i686 cmake ninja-build

      - name: Build glide3x.dll
        run: |
          cmake -S . -B build-g3x -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake \
            -DG3XVK_SLANGVK_DIR=${{ github.workspace }}/libslang-vk
          cmake --build build-g3x --target glide3x

      - name: Check the Glide export surface
        run: |
          i686-w64-mingw32-objdump -p build-g3x/glide3x.dll \
            | sed -n '/Ordinal\/Name Pointer/,$p' \
            | grep -oE '_[A-Za-z]+@[0-9]+' | sort -u > /tmp/ours.txt
          grep -oE '"_[A-Za-z]+@[0-9]+"' D2Client/Renderer/Glide.cpp \
            | tr -d '"' | sort -u > /tmp/game.txt
          diff /tmp/game.txt /tmp/ours.txt
          echo "glide3x.dll: $(wc -l < /tmp/ours.txt) exports, $(stat -c %s build-g3x/glide3x.dll) bytes"
          i686-w64-mingw32-strings build-g3x/glide3x.dll | grep -m1 '^glide3xvk ' || true

      - name: Upload glide3x.dll
        uses: actions/upload-artifact@v4
        with:
          name: glide3x-dll
          path: build-g3x/glide3x.dll
          if-no-files-found: error