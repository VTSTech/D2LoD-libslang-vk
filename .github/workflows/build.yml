name: build

on:
  push:
    branches: [main, vanilla-plus]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push makes an older build of the same ref pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-i686:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-i686 binutils-mingw-w64-i686 cmake ninja-build

      - name: Build from a clean clone
        run: tools/check-build.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      # check-build.sh builds in a temp clone and deletes it, so build in-tree
      # too and keep the exe as an artifact.
      - name: Build in-tree
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake
          cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Make stripped copy
        run: cp build/d2.exe build/d2-stripped.exe && strip build/d2-stripped.exe

      - name: Upload full d2.exe (symbolized crash reports need its DWARF)
        uses: actions/upload-artifact@v4
        with:
          name: d2-full-${{ github.sha }}
          path: build/d2.exe

      - name: Upload stripped d2.exe (play/distribute)
        uses: actions/upload-artifact@v4
        with:
          name: d2-stripped-${{ github.sha }}
          path: build/d2-stripped.exe

      - name: Upload linker map (crash address -> symbol, for triage)
        uses: actions/upload-artifact@v4
        with:
          name: d2-map-${{ github.sha }}
          path: build/d2exe.map
          if-no-files-found: warn
