name: build

on:
  push:
    branches: [main, vanilla-plus]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push makes an older build of the same ref pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-i686:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        timeout-minutes: 15
        run: |
          # A fresh runner can have unattended-upgrades holding the dpkg lock;
          # clear it instead of waiting silently for it.
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo dpkg --configure -a

          # -qq hid every symptom (a hang looked identical to a slow mirror).
          # Run visibly and retry; the 15-minute step timeout turns a hard
          # hang into a fast red X instead of burning the 6-hour job limit.
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=5 && break
            echo "::warning::apt-get update failed (attempt $i/3), retrying in 15s"
            sleep 15
          done

          for i in 1 2 3; do
            sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=60 \
              g++-mingw-w64-i686 binutils-mingw-w64-i686 cmake ninja-build && break
            echo "::warning::apt-get install failed (attempt $i/3), retrying in 15s"
            sleep 15
          done

          # 'apt-get ... && break' swallows a final failed attempt under
          # bash -e, so assert the toolchain actually landed.
          command -v i686-w64-mingw32-g++
          command -v cmake
          command -v ninja

      - name: Build from a clean clone
        run: tools/check-build.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      # check-build.sh builds in a temp clone and deletes it, so build in-tree
      # too and keep the exe as an artifact.
      - name: Build in-tree
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake
          cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"

      # Ship the stripped exe only. The link still embeds -O0 + DWARF (the
      # charter), but the fat exe is no longer uploaded: crash triage resolves
      # module+offset addresses against the map artifact below, which the link
      # writes via -Wl,-Map (CMakeLists.txt). strip does not move sections, so
      # map offsets stay valid against the stripped exe.
      - name: Make stripped d2s-<commit>.exe
        run: |
          D2S="build/d2s-${GITHUB_SHA::7}.exe"
          cp build/d2.exe "$D2S"
          strip "$D2S"
          echo "D2S=$D2S" >> "$GITHUB_ENV"

      - name: Upload d2s-<commit>.exe (play/distribute)
        uses: actions/upload-artifact@v4
        with:
          name: d2s-${{ github.sha }}
          path: ${{ env.D2S }}

      - name: Upload linker map (crash address -> symbol, for triage)
        uses: actions/upload-artifact@v4
        with:
          name: d2-map-${{ github.sha }}
          path: build/d2exe.map
          if-no-files-found: warn
