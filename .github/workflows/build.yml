name: build

on:
  push:
    branches: [main, vanilla-plus]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push makes an older build of the same ref pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-i686:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: '500M'
      # The cache-restored compiler's mtime changes on every restore; a
      # content hash keeps the compile cache warm anyway.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      # The installed toolchain tree (compilers, sysroot, cmake, ninja,
      # ccache), snapshotted under usr/ in the workspace. Restoring it is
      # ~30s and touches no network; apt is only the cold path. Two
      # consecutive runners failed the 152 MB apt install (30-min silent
      # hang, then a 15-min timeout), so a normal run must not need it.
      - name: Restore cached toolchain
        uses: actions/cache@v4
        with:
          path: toolchain-cache
          key: toolchain-${{ runner.os }}-noble-win32-v1

      - name: Install the toolchain (cache-first, apt only on a cold miss)
        timeout-minutes: 20
        run: |
          set -o pipefail

          if [ -x toolchain-cache/usr/bin/i686-w64-mingw32-g++-win32 ]; then
            sudo cp -a toolchain-cache/usr/. /usr/
            # Debian's generic compiler names are alternatives symlinks into
            # /etc/alternatives, which is not part of the snapshot - relink.
            sudo ln -sf i686-w64-mingw32-gcc-win32 /usr/bin/i686-w64-mingw32-gcc
            sudo ln -sf i686-w64-mingw32-g++-win32 /usr/bin/i686-w64-mingw32-g++
            if echo 'int main(){}' | i686-w64-mingw32-g++ -x c++ - -o /tmp/tc-smoke.exe; then
              echo "toolchain restored from cache; apt skipped"
              exit 0
            fi
            echo "::warning::cached toolchain failed its smoke test; reinstalling"
          fi

          export DEBIAN_FRONTEND=noninteractive
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo dpkg --configure -a

          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=2 && break
            echo "::warning::apt-get update failed (attempt $i/3), retrying in 10s"
            sleep 10
          done

          # -win32 only: the g++-mingw-w64-i686 meta-package pulls BOTH
          # threading models (~2x the download). This tree uses no
          # posix-threads API, and win32 is Debian's default alternative -
          # the exact compiler every previous run selected.
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=60 \
              g++-mingw-w64-i686-win32 binutils-mingw-w64-i686 cmake ninja-build ccache && break
            echo "::warning::apt-get install failed (attempt $i/3), retrying in 10s"
            sleep 10
          done

          command -v i686-w64-mingw32-g++
          command -v cmake
          command -v ninja
          command -v ccache
          echo 'int main(){}' | i686-w64-mingw32-g++ -x c++ - -o /tmp/tc-smoke.exe

          # Snapshot everything apt put under /usr for the cache action.
          rm -rf toolchain-cache && mkdir -p toolchain-cache
          sudo cp -a --parents \
            /usr/bin/i686-w64-mingw32-* /usr/bin/cmake /usr/bin/cpack /usr/bin/ctest \
            /usr/bin/ninja /usr/bin/ccache /usr/i686-w64-mingw32 \
            /usr/lib/gcc/i686-w64-mingw32 /usr/libexec/gcc/i686-w64-mingw32 \
            /usr/share/cmake-3.* \
            toolchain-cache/
          sudo chown -R "$(id -u):$(id -g)" toolchain-cache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure (charter flags, single build)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # check-build.sh's contract, inlined: every TU compiles strict, and the
      # triage map actually landed. The script itself stays for local use -
      # CI's checkout is already a clean clone, so its second full build
      # (~2x compile time) bought nothing here.
      - name: Gate - strict compile (no -fpermissive)
        run: "! grep -q -- '-fpermissive' build/compile_commands.json"

      - name: Build
        timeout-minutes: 60
        run: cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Gate - triage map exists and is substantial
        run: |
          test -s build/d2exe.map
          [ "$(wc -l < build/d2exe.map)" -gt 10000 ]
          grep -q 'D2MEM_CopyRows' build/d2exe.map

      - name: ccache stats
        run: ccache --show-stats

      - name: Make stripped d2s-<commit>.exe
        run: |
          D2S="build/d2s-${GITHUB_SHA::7}.exe"
          cp build/d2.exe "$D2S"
          strip "$D2S"
          echo "D2S=$D2S" >> "$GITHUB_ENV"

      - name: Upload d2s-<commit>.exe (play/distribute)
        uses: actions/upload-artifact@v4
        with:
          name: d2s-${{ github.sha }}
          path: ${{ env.D2S }}

      - name: Compress linker map (~10:1 on symbol text)
        run: gzip -9 build/d2exe.map

      # Triage: download, gunzip, grep the address. Same map the link wrote.
      - name: Upload linker map (crash address -> symbol, for triage)
        uses: actions/upload-artifact@v4
        with:
          name: d2-map-${{ github.sha }}
          path: build/d2exe.map.gz
          if-no-files-found: error
