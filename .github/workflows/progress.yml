name: progress

# Publishes the byte-match figures as an objdiff-style report for recomp.fyi,
# which reads the newest artifact named <version>_report from the default branch.
on:
  push:
    branches: [main]
    paths: ['progress/report.json']
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: progress
      - uses: actions/upload-artifact@v4
        with:
          name: 1.14d_report
          path: progress/report.json
          retention-days: 90
